<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Transcriptor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease;
        }

        .scroll-custom::-webkit-scrollbar {
            width: 6px;
        }
        .scroll-custom::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-custom::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .line-entry {
            border-bottom: 1px solid rgba(226, 232, 240, 0.5);
            padding: 1.25rem 0;
            display: grid;
            grid-template-columns: 1fr 1fr 40px;
            gap: 1.5rem;
            position: relative;
        }

        @media (max-width: 768px) {
            .line-entry {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            .copy-btn-wrapper {
                position: absolute;
                top: 0.5rem;
                right: 0.5rem;
            }
        }

        .listening-dot {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            70% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .loading-translate {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #3b82f6;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        canvas#visualizer {
            width: 60px;
            height: 20px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <!-- Header -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-500/20 text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Russian Transcriptor 1.0</h1>
                    <div class="flex items-center gap-2">
                        <canvas id="visualizer"></canvas>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Audio Feed</p>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button id="themeToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <svg id="sunIcon" class="hidden dark:block" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                    <svg id="moonIcon" class="block dark:hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
                <div id="statusBadge" class="hidden items-center bg-blue-50 dark:bg-blue-900/20 px-3 py-1.5 rounded-full border border-blue-200 dark:border-blue-800">
                    <span class="listening-dot mr-2"></span>
                    <span class="text-[10px] font-bold tracking-wider uppercase text-blue-600 dark:text-blue-400">Live Listening</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Control Bar -->
    <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 p-4 sticky top-[73px] z-40">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center gap-6">
            <div class="flex flex-col">
                <label class="text-[10px] font-bold text-slate-500 uppercase mb-1">Translate to:</label>
                <select id="targetLang" class="bg-slate-100 dark:bg-slate-800 border-none rounded-lg px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="id">Bahasa Indonesia</option>
                    <option value="en">English (UK/US)</option>
                    <option value="zh">Chinese (Simplified)</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label class="text-[10px] font-bold text-slate-500 uppercase mb-1">Text size:</label>
                <select id="fontSize" class="bg-slate-100 dark:bg-slate-800 border-none rounded-lg px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="text-base">Small</option>
                    <option value="text-xl" selected>Medium</option>
                    <option value="text-3xl">Big</option>
                </select>
            </div>

            <div class="flex items-center gap-2 mt-4 md:mt-0">
                <input type="checkbox" id="autoScroll" checked class="w-4 h-4 rounded text-blue-600">
                <label for="autoScroll" class="text-xs font-bold text-slate-500 uppercase">Auto-Scroll</label>
            </div>

            <div class="flex items-center gap-2 ml-auto">
                <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold transition-all shadow-lg shadow-blue-500/30 active:scale-95">
                    Start
                </button>
                <button id="stopBtn" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-bold transition-all shadow-lg shadow-red-500/30 active:scale-95 hidden">
                    Stop
                </button>
                <button id="downloadBtn" class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-6 py-2 rounded-lg font-bold transition-all">
                    Download
                </button>
                <button id="clearBtn" class="p-2 text-slate-400 hover:text-red-500 transition-all" title="Bersihkan Layar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col h-full min-h-[70vh]">
            <div class="grid grid-cols-2 gap-4 p-4 border-b dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                <div>Original (RU)</div>
                <div>Translation</div>
            </div>

            <div id="transcriptContainer" class="flex-grow p-4 md:p-8 scroll-custom overflow-y-auto max-h-[60vh]">
                <div id="welcomeMessage" class="text-center py-24">
                    <div class="bg-blue-100 dark:bg-blue-900/30 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-blue-600 dark:text-blue-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6 6-6"/></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Ready to listen</h2>
                    <p class="text-slate-500 dark:text-slate-400 max-w-sm mx-auto mt-3">Transcript and the translations will automaticly shows up each line.</p>
                </div>
                
                <div id="entriesList"></div>
                
                <!-- Interim Result -->
                <div id="interimRow" class="mt-6 opacity-60 hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div id="interimRussian" class="italic font-medium text-slate-400"></div>
                        <div></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast for Copy Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-xl opacity-0 transition-opacity pointer-events-none">
        Copied!
    </div>

    <!-- Error Box -->
    <div id="errorBox" class="fixed bottom-6 right-6 bg-red-600 text-white px-6 py-4 rounded-xl shadow-2xl transition-all translate-y-20 opacity-0 pointer-events-none max-w-md flex items-start gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <div>
            <p class="font-bold">Error</p>
            <p id="errorMsg" class="text-sm opacity-90"></p>
        </div>
    </div>

    <!-- Hidden textarea for copying -->
    <textarea id="copyBuffer" class="fixed -top-full opacity-0 pointer-events-none"></textarea>

    <script>
        const apiKey = "AIzaSyAOyQaEto4nHtfMGLxrxYykr3tw2tPQJ34"; 
        const model = "gemini-2.5-flash-preview-09-2025";

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const themeToggle = document.getElementById('themeToggle');
        const entriesList = document.getElementById('entriesList');
        const interimRow = document.getElementById('interimRow');
        const interimRussian = document.getElementById('interimRussian');
        const targetLang = document.getElementById('targetLang');
        const fontSize = document.getElementById('fontSize');
        const autoScroll = document.getElementById('autoScroll');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const statusBadge = document.getElementById('statusBadge');
        const transcriptContainer = document.getElementById('transcriptContainer');
        const toast = document.getElementById('toast');
        const copyBuffer = document.getElementById('copyBuffer');
        const visualizerCanvas = document.getElementById('visualizer');

        let recognition;
        let fullTranscript = [];
        let audioContext, analyser, dataArray, source;

        // --- THEME MANAGEMENT ---
        themeToggle.onclick = () => {
            document.documentElement.classList.toggle('dark');
        };

        // --- VISUALIZER SETUP ---
        async function setupVisualizer() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 32;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                drawVisualizer();
            } catch (e) { console.log("Visualizer blocked or no mic"); }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const ctx = visualizerCanvas.getContext('2d');
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
            const barWidth = 4;
            let x = 0;
            for(let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * visualizerCanvas.height;
                ctx.fillStyle = document.documentElement.classList.contains('dark') ? '#3b82f6' : '#2563eb';
                ctx.fillRect(x, visualizerCanvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 2;
            }
        }

        // --- SPEECH RECOGNITION ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ru-RU';

            recognition.onstart = () => {
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                statusBadge.classList.replace('hidden', 'flex');
                welcomeMessage.classList.add('hidden');
                interimRow.classList.remove('hidden');
                if(!audioContext) setupVisualizer();
            };

            recognition.onresult = async (event) => {
                let currentInterim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        handleFinalTranscript(transcript.trim());
                    } else {
                        currentInterim += transcript;
                    }
                }
                interimRussian.innerText = currentInterim;
                if(autoScroll.checked) transcriptContainer.scrollTop = transcriptContainer.scrollHeight;
            };

            recognition.onerror = (e) => showError(`Mic error: ${e.error}`);
            recognition.onend = () => {
                startBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                statusBadge.classList.replace('flex', 'hidden');
                interimRow.classList.add('hidden');
            };
        }

        async function handleFinalTranscript(ru) {
            if (!ru) return;
            const entryId = Date.now();
            const entryDiv = document.createElement('div');
            entryDiv.className = `line-entry ${fontSize.value} group`;
            entryDiv.innerHTML = `
                <div class="russian-text font-semibold text-slate-800 dark:text-slate-200">${ru}</div>
                <div class="translation-text text-slate-400 italic flex items-center gap-2">
                    <span class="loading-translate"></span>
                </div>
                <div class="copy-btn-wrapper flex justify-end">
                    <button onclick="copyLine('${ru}', this)" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 transition-all opacity-0 group-hover:opacity-100">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                </div>
            `;
            entriesList.appendChild(entryDiv);
            if(autoScroll.checked) transcriptContainer.scrollTop = transcriptContainer.scrollHeight;

            const target = { 'id': 'Indonesian', 'en': 'English', 'zh': 'Chinese (Simplified)' }[targetLang.value];
            try {
                const tr = await translateAI(ru, target);
                const el = entryDiv.querySelector('.translation-text');
                el.classList.remove('italic', 'text-slate-400');
                el.classList.add('text-blue-600', 'dark:text-blue-400', 'font-medium');
                el.innerHTML = tr;
                fullTranscript.push({ ru, tr, lang: target });
            } catch (err) {
                entryDiv.querySelector('.translation-text').innerHTML = "<span class='text-red-400'>Translation Failed</span>";
            }
        }

        async function translateAI(text, target, retry = 0) {
            const prompt = `Translate to ${target}: "${text}". Only output translated text.`;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                if (!res.ok) throw new Error();
                const d = await res.json();
                return d.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "---";
            } catch (e) {
                if (retry < 3) return translateAI(text, target, retry + 1);
                throw e;
            }
        }

        window.copyLine = (text, btn) => {
            copyBuffer.value = text;
            copyBuffer.select();
            document.execCommand('copy');
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 2000);
        };

        downloadBtn.onclick = () => {
            if(!fullTranscript.length) return showError("No transcript yet.");
            let out = `KULIAH RUSIA - ${new Date().toLocaleDateString()}\n\n`;
            fullTranscript.forEach((t, i) => out += `[${i+1}] RU: ${t.ru}\n    ${t.lang}: ${t.tr}\n\n`);
            const b = new Blob([out], { type: 'text/plain' });
            const url = URL.createObjectURL(b);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Transcript_Russia_${Date.now()}.txt`;
            a.click();
        };

        startBtn.onclick = () => recognition.start();
        stopBtn.onclick = () => recognition.stop();
        clearBtn.onclick = () => { entriesList.innerHTML = ''; fullTranscript = []; welcomeMessage.classList.remove('hidden'); };
        fontSize.onchange = (e) => {
            document.querySelectorAll('.line-entry').forEach(el => {
                el.classList.remove('text-base', 'text-xl', 'text-3xl');
                el.classList.add(e.target.value);
            });
        };

        function showError(m) {
            const b = document.getElementById('errorBox');
            document.getElementById('errorMsg').innerText = m;
            b.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => b.classList.add('translate-y-20', 'opacity-0'), 5000);
        }
    </script>
</body>
</html>
